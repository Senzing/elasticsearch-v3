x-senzing-engine-configuration-json: &senzing-engine-configuration-json >-
  {
    "PIPELINE": {
      "CONFIGPATH": "/etc/opt/senzing",
      "LICENSESTRINGBASE64": "${SENZING_LICENSE_BASE64_ENCODED}",
      "RESOURCEPATH": "/opt/senzing/g2/resources",
      "SUPPORTPATH": "/opt/senzing/data"
    },
    "SQL": {
      "BACKEND": "SQL",
      "CONNECTION": "postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-senzing-postgres}:${POSTGRES_PORT:-5432}:${POSTGRES_DB:-G2}/?sslmode=disable"
    }
  }

services:

  postgres:
    container_name: senzing-postgres
    environment:
      # See https://hub.docker.com/_/postgres
      POSTGRES_DB: ${POSTGRES_DB:-G2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DB:-G2}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    image: postgres:${SENZING_DOCKER_IMAGE_VERSION_POSTGRES:-18}
    networks:
      - senzing
    ports:
      - 5432:5432
    restart: always
    volumes:
      - ${POSTGRES_DIR:-/var/lib/postgresql}:/var/lib/postgresql

  initdatabase:
    command: mandatory
    container_name: senzing-init-postgresql
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SENZING_ENGINE_CONFIGURATION_JSON: *senzing-engine-configuration-json
    image: senzing/init-postgresql:${SENZING_DOCKER_IMAGE_VERSION_INIT_POSTGRESQL:-1.1.21}
    networks:
      - senzing
    restart: on-failure

  adddatasources:
    command:
      - sh
      - -c
      - |
        printf '%s\n' 'addDataSource CUSTOMERS' 'addDataSource REFERENCE' 'addDataSource WATCHLIST' 'save' > /tmp/datasources.g2c
        python3 /opt/senzing/g2/python/G2ConfigTool.py -f /tmp/datasources.g2c
    container_name: senzing-add-datasources
    depends_on:
      initdatabase:
        condition: service_completed_successfully
    environment:
      SENZING_ENGINE_CONFIGURATION_JSON: *senzing-engine-configuration-json
    image: senzing/senzingapi-tools:${SENZING_DOCKER_IMAGE_VERSION_SENZINGAPI_TOOLS:-3.13.2}
    networks:
      - senzing

networks:
  senzing:
    name: ${SENZING_DOCKER_NETWORK:-senzing-network}
